services:
  r1:
    build:
      context: ../..
      dockerfile: lab/docker/Dockerfile
    container_name: gobgp-r1
    command: ["-f", "/etc/gobgp/gobgpd.conf", "--api-hosts", "0.0.0.0:50051"]
    volumes:
      - ./r1/gobgpd.conf:/etc/gobgp/gobgpd.conf:ro
    networks:
      gobgp-net:
        ipv4_address: 10.10.0.11

  r2:
    build:
      context: ../..
      dockerfile: lab/docker/Dockerfile
    container_name: gobgp-r2
    command: ["-f", "/etc/gobgp/gobgpd.conf", "--api-hosts", "0.0.0.0:50051"]
    volumes:
      - ./r2/gobgpd.conf:/etc/gobgp/gobgpd.conf:ro
    networks:
      gobgp-net:
        ipv4_address: 10.10.0.12

networks:
  gobgp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
